  <line x1="108" y1="98" x2="198" y2="98" stroke="#C49455" strokeWidth="1"/>

  <!-- Person legs (dark navy trousers) -->
  <path d="M118 155 L122 130 L130 130 L133 155Z" fill="#2D3B5E"/>
  <path d="M130 155 L130 130 L138 130 L140 155Z" fill="#2D3B5E"/>

  <!-- Person body (blue jacket) -->
  <path d="M112 105 C112 100 116 95 125 93 L135 91 C140 90 143 93 143 98 L143 130 L112 130Z" fill="#5B8EC5"/>

  <!-- Person left arm holding clipboard -->
  <path d="M112 105 L104 118 L110 121 L117 110Z" fill="#5B8EC5"/>

  <!-- Clipboard -->
  <rect x="100" y="117" width="14" height="18" rx="2" fill="#3A5A8C"/>
