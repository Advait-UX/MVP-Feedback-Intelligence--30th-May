  <!-- Ground line -->
  <line x1="80" y1="160" x2="220" y2="160" stroke="#C8D0DC" strokeWidth="1.5" strokeLinecap="round"/>

  <defs>
    <linearGradient id="boxShade" x1="108" y1="98" x2="198" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stopColor="#000" stopOpacity="0"/>
      <stop offset="1" stopColor="#000" stopOpacity="0.07"/>
