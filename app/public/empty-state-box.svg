<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background blob -->
  <path d="M220 30 C260 30 275 65 270 100 C265 135 240 155 200 158 C160 161 100 155 70 135 C40 115 30 85 45 60 C60 35 90 20 130 18 C160 16 180 30 220 30Z" fill="#E8EDF5"/>

  <!-- Box body -->
  <rect x="108" y="98" width="90" height="62" rx="3" fill="#D4A96A"/>
  <!-- Box front face shading -->
  <rect x="108" y="98" width="90" height="62" rx="3" fill="url(#boxShade)"/>

  <!-- Box left flap (open) -->
  <path d="M108 98 L108 75 L153 83 L153 98Z" fill="#C49455"/>
  <!-- Box right flap (open, angled up) -->
  <path d="M198 98 L198 72 L153 83 L153 98Z" fill="#BD8C4C"/>
  <!-- Box left outer flap -->
  <path d="M108 98 L108 72 L128 62 L153 83 L153 98Z" fill="#E8C07A"/>
  <!-- Box right outer flap -->
  <path d="M198 98 L198 70 L178 60 L153 83 L153 98Z" fill="#DDAD65"/>

