<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test program · approach 1 · Left stepper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== Lyra tokens ===================== */
:root{
 --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
 --canvas:#F3F5F6;
 --bg-base:#FFFFFF; --bg-shell:#F5F7F9; --bg-subtle:#FBFCFE;
 --bg-primary:#166CCA; --bg-disabled:rgba(0,0,0,.06);
 --bg-active-subtle:#F1F7FE; --bg-active-moderate:#D3E6FD;
 --bg-ai:#F6F3FC; --bg-inverse:#2A2D32;
 --fg:rgba(0,0,0,.8); --fg-2:rgba(0,0,0,.6); --fg-3:rgba(0,0,0,.4); --fg-dis:rgba(0,0,0,.3);
 --fg-link:#166CCA; --fg-active:#185BA4; --fg-action:#5D6A79;
 --bd-subtle:rgba(0,0,0,.1); --bd-soft:rgba(0,0,0,.16); --bd-medium:rgba(0,0,0,.32); --bd-active:#166CCA; --bd-selected:#2D5BB9;
 --ok-subtle:#EBFAED; --ok:#23722D; --ok-icon:#197E26;
 --warn-subtle:#FFFAE0; --warn:#8E6800;
 --crit-subtle:#FFF0F0; --crit:#BD2A2A;
 --info-subtle:#F0F5FF; --info:#2D5BB9;
 --hover:rgba(0,0,0,.04); --pressed:rgba(0,0,0,.08); --hover-pri:#185BA4; --pressed-pri:#164479;
 --ai-fg:#6E56CC; --ai-bg:#EFEBFF; --ai-deep:#4E39A8; --ai-bd:rgba(110,86,204,.24);
 --brand-50:#E9F1FC; --brand-200:#A6C6F0; --brand-500:#3D81E7;
 --slate-200:#EEF0F2; --slate-300:#D2D8DB; --slate-400:#A8B3BB; --slate-500:#82959E; --slate-900:#1D2630;
 --scrim:rgba(0,0,0,.24);
 --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
 --sh-sm:0 2px 6px rgba(0,0,0,.04); --sh-md:0 4px 12px rgba(0,0,0,.06); --sh-lg:0 12px 24px rgba(0,0,0,.08); --sh-xl:0 20px 40px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 14px/20px var(--font-sans);color:var(--fg);background:var(--canvas);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--fg-active);outline-offset:2px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.t-title{font:600 20px/24px var(--font-sans)}
.t-h{font:500 16px/20px var(--font-sans)}
.t-h15{font:500 15px/20px var(--font-sans)}
.t-lbl{font:500 14px/20px var(--font-sans)}
.t-13{font:400 13px/18px var(--font-sans)}
.t-sm{font:400 12px/16px var(--font-sans);letter-spacing:.2px}
.t-sm-e{font:500 12px/16px var(--font-sans);letter-spacing:.2px}
.t-xs{font:400 11px/14px var(--font-sans)}
.sec{color:var(--fg-2)}
.req{color:var(--crit)}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{color:var(--fg-link);font-weight:500;border-radius:var(--r-xs)}
.link:hover{text-decoration:underline}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}

/* ===================== Shell ===================== */
.app{display:flex;flex-direction:column;height:100vh}
.top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 8px}
.switcher{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px;border-radius:var(--r-md);font:500 15px/20px var(--font-sans)}
.switcher:hover{background:var(--hover)}
.switcher .ic{color:var(--fg-3)}
.top-r{display:flex;align-items:center;gap:8px}
.tbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--fg);position:relative}
.tbtn:hover{background:var(--hover)}
.badge{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-full);background:#E32926;color:#fff;font:600 10px/16px var(--font-sans);text-align:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--slate-500);color:#fff;display:grid;place-items:center;font:600 12px/1 var(--font-sans);flex:none}
.shell{flex:1;min-height:0;display:flex;position:relative}
.side{flex:none;padding:8px 12px;display:flex;flex-direction:column;gap:2px;transition:width .2s}
.side.open{width:232px}
.side.rail{width:60px}
.nav{position:relative;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-md);width:100%;text-align:left;color:var(--fg);white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--bg-active-moderate);color:var(--fg-active);font-weight:500}
.nav.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--fg-active)}
.nav .chev{margin-left:auto;color:var(--fg-3)}
.side.rail .nav{width:36px;padding:0;justify-content:center}
.side.rail .nav span,.side.rail .nav .chev{display:none}
.subnav{margin:2px 0 4px 20px;border-left:1px solid var(--bd-subtle);padding-left:12px;display:flex;flex-direction:column;gap:1px}
.subnav button{height:32px;padding:0 8px;border-radius:var(--r-md);font-size:14px;text-align:left;width:100%;color:var(--fg)}
.subnav button:hover{background:var(--hover)}
.side.rail .subnav{margin-left:17px;padding-left:10px;gap:14px;padding-top:8px;padding-bottom:8px}
.side.rail .subnav button{height:4px;width:12px;padding:0;background:none;color:transparent;overflow:hidden;position:relative}
.side.rail .subnav button::after{content:"···";position:absolute;left:0;top:-8px;color:var(--fg-3);font-size:12px;letter-spacing:1px}
.collapse{position:absolute;top:36px;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--bd-soft);color:var(--fg-action);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1);z-index:5;transition:left .2s}
.collapse:hover{background:var(--hover)}
.pane{flex:1;min-width:0;margin:8px 12px 12px 0;background:#fff;border:1px solid var(--bd-subtle);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;display:flex;flex-direction:column;position:relative}

/* page header */
.phead{display:flex;align-items:center;gap:16px;height:64px;padding:0 32px;border-bottom:1px solid var(--bd-subtle);flex:none}
.crumbs{display:flex;align-items:center;gap:8px;font:400 16px/20px var(--font-sans);color:var(--fg-2);min-width:0}
.crumbs button{color:var(--fg-2);border-radius:var(--r-xs);font:inherit}
.crumbs button:hover{color:var(--fg);text-decoration:underline}
.crumbs .cur{font:600 20px/24px var(--font-sans);color:var(--fg);white-space:nowrap}
.hbtns{display:flex;align-items:center;gap:8px;margin-left:auto}
.vdiv{width:1px;height:24px;background:var(--bd-soft)}

/* ===================== Controls ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--r-md);font:500 14px/20px var(--font-sans);white-space:nowrap;transition:background .15s}
.btn.sm{height:32px;padding:0 12px}
.btn.xs{height:26px;padding:0 10px;font-size:12px;border-radius:var(--r-sm)}
.btn.mw{min-width:80px}
.btn.pri{background:var(--bg-primary);color:#fff}
.btn.pri:hover{background:var(--hover-pri)}
.btn.pri:active{background:var(--pressed-pri)}
.btn.out{background:#fff;box-shadow:inset 0 0 0 1px var(--bd-soft);color:var(--fg)}
.btn.out:hover{background:var(--hover)}
.btn.ghost{color:var(--fg-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.ghost.blue{color:var(--fg-link)}
.btn:disabled,.btn.dis{background:var(--bg-disabled)!important;color:var(--fg-dis)!important;box-shadow:none!important;cursor:not-allowed}
.btn.ghost:disabled{background:transparent!important}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--fg-action);flex:none}
.iconbtn:hover{background:var(--hover)}
.input{height:36px;border:1px solid var(--bd-soft);border-radius:var(--r-md);background:#fff;padding:0 12px;width:100%}
.input::placeholder{color:var(--fg-3)}
.input:focus{outline:none;border-color:var(--bd-active);box-shadow:0 0 0 2px rgba(24,91,164,.12)}
.input.err{border-color:var(--crit)}
.input:disabled{background:var(--bg-disabled);color:var(--fg-dis)}
.search{position:relative}
.search>.ic{position:absolute;left:12px;top:10px;color:var(--fg-2)}
.search .input{padding-left:36px;padding-right:36px}
.search .clr{position:absolute;right:2px;top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--r-sm);font:400 13px/16px var(--font-sans);white-space:nowrap}
.tag.ai{color:var(--ai-fg);background:var(--ai-bg);box-shadow:inset 0 0 0 1px var(--ai-fg)}
.tag.ai.flat{box-shadow:none;color:var(--ai-deep)}
.tag.ok{background:var(--ok-subtle);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(35,114,45,.35)}
.tag.warn{background:var(--warn-subtle);color:var(--warn)}
.tag.info{background:var(--info-subtle);color:var(--info);box-shadow:inset 0 0 0 1px rgba(45,91,185,.35)}
.tag.muted{background:var(--bg-shell);color:var(--fg);box-shadow:inset 0 0 0 1px var(--bd-soft)}
.tag.grey{background:var(--bg-shell);color:var(--fg-2)}
.tag.band{background:var(--ai-deep);color:#fff;border-radius:var(--r-full);height:18px;min-width:18px;justify-content:center;padding:0 6px;font:500 9px/1 var(--font-sans)}
.chipbtn{height:24px;padding:0 8px;border-radius:var(--r-full);box-shadow:inset 0 0 0 1px var(--bd-soft);font:400 10px/14px var(--font-sans);color:var(--fg-2);background:#fff}
.chipbtn:hover{background:var(--hover)}
.chipbtn.on{background:var(--bg-active-subtle);box-shadow:inset 0 0 0 1px var(--bd-active);color:var(--fg-active);font-weight:500}
.cb{width:16px;height:16px;accent-color:var(--bg-primary);cursor:pointer;flex:none;margin-top:2px}
.tgl{position:relative;width:40px;height:22px;border-radius:var(--r-full);background:var(--bg-primary);flex:none}
.tgl i{position:absolute;top:2px;left:20px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);display:grid;place-items:center;color:var(--bg-primary)}
.tgl.off{background:#fff;box-shadow:inset 0 0 0 1px var(--bd-soft)}
.tgl.off i{left:2px;background:var(--slate-300)}
.tgl.off i::after{content:"";width:8px;height:2px;border-radius:1px;background:#fff}
.okc{width:16px;height:16px;border-radius:50%;background:var(--ok-icon);color:#fff;display:grid;place-items:center;flex:none}
.emc{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bd-soft);flex:none;background:#fff}
.curc{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bd-active);flex:none;background:#fff}
.tip{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:var(--fg-action);vertical-align:middle;flex:none}
.tip:hover,.tip:focus-visible{background:var(--hover)}
.tipbox{display:none;position:absolute;z-index:80;top:26px;left:50%;transform:translateX(-50%);width:280px;padding:8px 12px;background:#fff;color:var(--fg);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--bd-soft),var(--sh-lg);font:400 13px/18px var(--font-sans);text-align:left;letter-spacing:0;text-transform:none;white-space:normal;pointer-events:none}
.tip.r .tipbox{left:auto;right:0;transform:none}
.tip.l .tipbox{left:0;transform:none}
.tip:hover .tipbox,.tip:focus-visible .tipbox{display:block}
.hastip{position:relative}
.hastip:hover>.tipbox{display:block}

/* ===================== Program page ===================== */
.zbody{flex:1;min-height:0;display:flex;gap:24px;padding:24px 32px 0}
.znav{width:160px;flex:none;display:flex;flex-direction:column;gap:4px;align-self:flex-start}
.zmain{flex:1;min-width:0;overflow-y:auto;padding-bottom:48px}
.zside{width:224px;flex:none;align-self:flex-start}
.step{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 8px 6px 0;border-radius:var(--r-md);text-align:left;width:100%;color:inherit;text-decoration:none}
.step:hover{background:var(--hover)}
.step .sl{font:500 12px/16px var(--font-sans);letter-spacing:.2px}
.ndiv{height:17px;display:flex;align-items:center}
.ndiv::after{content:"";height:1px;flex:1;background:var(--bd-subtle)}
.sum{background:var(--bg-subtle);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px}
.srow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.srow .k{color:var(--fg-2)}
.srow .v{font-weight:500;text-align:right}
.card{border:1px solid var(--bd-subtle);border-radius:var(--r-lg);padding:20px;margin-bottom:24px;background:#fff}
.card:last-child{margin-bottom:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.chead .row{gap:6px}
.sub{border-top:1px solid var(--bd-subtle);margin-top:20px;padding-top:20px}
.fld{display:flex;flex-direction:column;gap:4px;width:400px;max-width:100%}
.days{display:flex;gap:clamp(8px,1vw,20px)}
.day{flex:1;min-width:0;height:36px;padding:0 6px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;gap:5px;font:500 13px/20px var(--font-sans);color:var(--fg-active);background:var(--bg-active-subtle);box-shadow:inset 0 0 0 1px var(--bd-selected)}
.chan{width:197px;height:36px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:4px}
.chan.on{font-weight:500;color:var(--fg-active);background:var(--bg-active-subtle);box-shadow:inset 0 0 0 1px var(--bd-active)}
.chan.dis{color:var(--fg-dis);background:var(--bg-disabled);box-shadow:inset 0 0 0 1px var(--bd-subtle);cursor:not-allowed}
.gbox{background:var(--bg-shell);border-radius:var(--r-lg);overflow:hidden}
.gbox-h{min-height:56px;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd-subtle)}
.gbox-f{padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--fg-2)}
.gbox-f b{font-weight:500;color:var(--fg)}
.icirc{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;color:var(--fg-2)}
.seg{display:flex;width:400px;height:36px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--bd-soft)}
.seg button{flex:1;border-radius:var(--r-md)}
.seg .on{font-weight:500;color:var(--fg-active);background:var(--bg-active-subtle);box-shadow:inset 0 0 0 1px var(--bd-selected)}
.sel{height:36px;padding:0 12px;border:1px solid var(--bd-soft);border-radius:var(--r-md);display:flex;align-items:center;justify-content:space-between}
.num{display:flex;width:400px;height:36px;border:1px solid var(--bd-soft);border-radius:var(--r-md);overflow:hidden;align-items:center}
.num .st{width:28px;height:100%;border-left:1px solid var(--bd-soft);display:flex;flex-direction:column}
.num .st span{flex:1;display:grid;place-items:center;color:var(--fg-2)}
.num .st span+span{border-top:1px solid var(--bd-soft)}
.datei{height:36px;padding:0 36px 0 12px;border:1px solid var(--bd-soft);border-radius:var(--r-md);position:relative;line-height:34px}
.datei .ic{position:absolute;right:10px;top:10px;color:var(--slate-500)}
.datei.dis{color:var(--fg-3)}
.datei.dis .ic{display:none}
.strip{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-md);margin-bottom:24px}
.strip.ok{background:var(--ok-subtle);color:var(--ok)}
.strip.muted{background:var(--bg-shell)}

/* ===================== Test flow ===================== */
.tbody{flex:1;min-height:0;display:flex;gap:16px;padding:32px 32px 24px}
.tnav{width:210px;flex:none;align-self:flex-start;display:flex;flex-direction:column}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.tstep{display:flex;align-items:center;gap:8px;min-height:28px;padding:4px 0;text-align:left;width:100%;font:500 14px/20px var(--font-sans);color:var(--fg);border-radius:var(--r-sm)}
.tstep.cur{color:var(--fg-link)}
.tstep.lvl2{font:400 13px/16px var(--font-sans);color:var(--fg-2);padding-left:16px;min-height:26px;align-items:flex-start}
.tstep.lvl2 .emc,.tstep.lvl2 .curc,.tstep.lvl2 .okc{width:14px;height:14px;margin-top:1px}
.tstep.lvl2.cur{color:var(--fg-link);font-weight:500}
.tstep.lvl2.done{color:var(--fg)}
.tstep.click:hover{text-decoration:underline;cursor:pointer}
.tgap{height:16px}
.tgap.sm{height:6px}
.tfoot{display:flex;align-items:center;gap:12px;padding-top:24px;flex:none}

/* batch */
.bcard{border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:#fff;padding:16px;display:flex;flex-direction:column}
.bcard+.bcard{margin-top:16px}
.bcard.fill{flex:1;min-height:0}
.bh{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.found{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-md);background:var(--bg-active-subtle);box-shadow:inset 0 0 0 1px var(--bd-active);margin-top:16px;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.boxic{width:40px;height:40px;border-radius:50%;background:var(--bg-active-subtle);color:var(--fg-active);display:grid;place-items:center;flex:none}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:10px 12px;font:500 14px/20px var(--font-sans);color:var(--fg);border-bottom:1px solid var(--bd-subtle);white-space:nowrap}
.tbl td{padding:8px 12px;height:50px;border-bottom:1px solid var(--bd-subtle);vertical-align:middle}
.tbl tbody tr:hover,.tbl tr.hl{background:var(--bg-active-subtle)}
.tbl tbody tr{transition:background-color .6s ease}
.tbl tbody tr.new,.tbl tbody tr.new:hover{background:var(--bg-active-subtle)}
@keyframes flash{0%,40%{background:var(--bg-active-moderate)}100%{background:transparent}}
.tbl .cust{color:var(--fg-link);font-weight:400}
.tbl .cust:hover{text-decoration:underline}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:32px}
.empty p{max-width:420px}
.menu{position:absolute;right:0;top:36px;z-index:50;background:#fff;border-radius:var(--r-md);box-shadow:0 0 0 1px var(--bd-subtle),var(--sh-lg);padding:4px;min-width:200px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:var(--r-sm);text-align:left;width:100%}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--crit)}

/* test workspace */
.ihead{display:flex;align-items:center;gap:16px;padding:16px 20px;border:1px solid var(--bd-subtle);border-radius:var(--r-md);min-height:80px;flex:none}
.hintline{display:flex;align-items:center;gap:10px;padding:14px 0 12px;flex:none;min-height:46px}
.infoi{width:16px;height:16px;border-radius:50%;background:var(--bg-primary);color:#fff;display:grid;place-items:center;font:600 10px/1 var(--font-sans);flex:none}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,356fr) minmax(320px,560fr) minmax(330px,369fr);gap:16px}
.pcol{border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:#fff;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.pcol.cur{border-color:var(--bd-active);box-shadow:0 0 0 1px var(--bd-active)}
.pcol.mid .pbody{background:var(--bg-shell)}
.pch{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-bottom:1px solid var(--bd-subtle);flex:none}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.pbody>*:not(.phone){flex-shrink:0}
.pbody.center{align-items:center;padding-bottom:20px}
.convo{border-radius:var(--r-md);background:var(--bg-shell);overflow:hidden}
.convo-h{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left}
.convo-h:hover{background:var(--hover)}
.tr{display:flex;flex-direction:column;gap:2px;padding:0 8px 8px}

/* ===================== Enhanced flow (Oct 31) ===================== */
/* tone (sentiment) pill — status colours reserved for status; tone is a read-out of the conversation */

/* readiness card */

/* density pass so a 7-row batch fits a 900px-tall window */

.bulk{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 4px 0 12px;border-radius:var(--r-md);background:var(--bg-active-subtle);box-shadow:inset 0 0 0 1px var(--bd-active);animation:pop .15s ease}

 demo(w){
  S=fresh(w==='new'?'new':'existing');clearTimeout(toastT);document.getElementById('toasts').innerHTML='';
  const T=(h,m)=>`Oct 31, 2026, ${h}:${m} AM`;
  const mk=(k,rating,ans,at)=>{const s=ST(k);s.readDone=true;s.fuSeen=true;s.phone={stage:'done',rating,answer:ans,writing:false,declined:false};hist(k,'added','Added to the test batch',at||T(9,'02'));hist(k,'played',`Played as ${P(k).first}: rated ${rating} (${SCALE[rating-1]})${isCtx(k)?`, saw the ${BL[bandOf(rating)]} follow-up`:''}`,at||T(9,'10'))};
  const conf=(k,at)=>{const s=ST(k);s.status='confident';s.confAt=at;s.snap=snapOf(k);hist(k,'confident','Marked confident',at);addLog('confident',`Confident: ${P(k).name}`)};
  if(w==='inprog'){
   S.scenario='inprog';S.introSeen=true;S.banner=false;S.rail=true;S.view='hub';
   S.batch=['marcus','sofia','priya','leo','daniel','amara','tom'];
   addLog('session','Test session started by '+ME);
   /* Marcus: played, follow-up rewritten, confident */
   mk('marcus',1,'I had to ask twice.');const m=ST('marcus').bands.low;m.text=P('marcus').rw.low;m.st='updated';m.why=['Too generic'];
   hist('marcus','rewrite',`Rewrote the follow-up for a 1 to 2 rating: “${m.text}”`,T(9,'14'));addLog('rewrite',`Marcus Wright, 1 to 2: “${m.text}”`);
   S.rules=[{id:'r1',kind:'why',text:'Never ask "why" directly',words:'no why questions'}];addLog('rule','Rule added: Never ask "why" directly · your words: “no why questions”');hist('marcus','rule','Added a rule for Billing Survey: Never ask "why" directly',T(9,'15'));
   conf('marcus',T(9,'16'));
   /* Sofia: confident, then retested with a rating that diverges from the tone → changed since confident */
   mk('sofia',1,'Removing it on the spot.');conf('sofia',T(9,'24'));
   const sf=ST('sofia');sf.phone={stage:'done',rating:5,answer:'Ben was clear about next steps.',writing:false,declined:false};
   hist('sofia','played','Played as Sofia: rated 5 (Very satisfied), saw the 4 to 5 follow-up',T(9,'41'));
   const sh=sf.bands.high;sh.text=P('sofia').rw.high;sh.st='updated';sh.why=['Too generic'];
   hist('sofia','rewrite',`Rewrote the follow-up for a 4 to 5 rating: “${sh.text}”`,T(9,'42'));addLog('rewrite',`Sofia Alvarez, 4 to 5: “${sh.text}”`);
   sf.dropped={at:sf.confAt};sf.status='played';sf.confAt=null;hist('sofia','dropped','Confident mark removed: the follow-ups changed',T(9,'42'));addLog('notyet','Confident mark removed, follow-ups changed: Sofia Alvarez');
   const sl=sf.bands.low;sl.text='What would have made sorting out this charge fair?';sl.st='updated';sl.why=['Wrong tone'];
   hist('sofia','rewrite',`Rewrote the follow-up for a 1 to 2 rating: “${sl.text}”`,T(9,'43'));addLog('rewrite',`Sofia Alvarez, 1 to 2: “${sl.text}”`);
   S.rules.push({id:'r2',kind:'phrase',match:'late fee',text:'Never say "late fee" in a follow-up',words:'dont say late fee, say charge'});addLog('rule','Rule added: Never say "late fee" in a follow-up');sf.open=null;
   hist('sofia','rule','Added a rule for Billing Survey: Never say "late fee" in a follow-up. The 3 follow-up doesn\'t follow it.',T(9,'44'));
   /* Priya: played, no verdict yet */
   mk('priya',3,'A tracking link.',T(9,'47'));ST('priya').status='played';
   /* Leo: a follow-up is mid-fix */
   mk('leo',3,'Reset it myself.',T(9,'52'));ST('leo').status='played';const lb=ST('leo').bands.mid;lb.prev='orig';lb.st='pending';lb.mode='fix';lb.reasons=['Tone'];
   /* Daniel: played, no verdict yet */
   mk('daniel',4,'Very clear.',T(9,'58'));ST('daniel').status='played';
   /* Amara, Tom: not tested */
   hist('amara','added','Added to the test batch',T(9,'02'));hist('tom','added','Added to the test batch',T(9,'02'));
  }
  if(w==='ready'){
   S.scenario='ready';S.introSeen=true;S.banner=false;S.rail=true;S.view='hub';
   S.batch=['marcus','sofia','priya','leo','daniel','amara'];addLog('session','Test session started by '+ME);
   mk('marcus',1,'I had to ask twice.',T(9,'10'));conf('marcus',T(9,'16'));
   mk('sofia',2,'Knowing about bank delays up front.',T(9,'22'));conf('sofia',T(9,'27'));
   mk('priya',3,'A firm date.',T(9,'33'));conf('priya',T(9,'36'));
   mk('leo',5,'Quick link.',T(9,'40'));conf('leo',T(9,'43'));
   mk('daniel',4,'Very clear.',T(9,'48'));const d=ST('daniel').bands.high;d.text=P('daniel').rw.high;d.st='updated';d.why=['Leading'];hist('daniel','rewrite',`Rewrote the follow-up for a 4 to 5 rating: “${d.text}”`,T(9,'50'));addLog('rewrite',`Daniel Kim, 4 to 5: “${d.text}”`);conf('daniel',T(9,'52'));
   mk('amara',2,'A faster answer.',T(9,'57'));ST('amara').status='played';
  }
  render()},
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.drawer||S.modal||S.menu))A.close()});
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('.menuwrap')){S.menu=null;render()}});
</script>
<script>

/* ================= Shell ================= */
function shell(inner){
 const rail=S.rail;
 return `<div class="app">
 <header class="top">
  <button class="switcher">${LOGO}<span>Feedback Intelligence</span>${ic('cd',14)}</button>
  <div class="top-r"><button class="tbtn" aria-label="Help">${ic('help',20)}</button><button class="tbtn" aria-label="Notifications">${ic('bell',20)}<span class="badge">5</span></button><span class="row" style="gap:4px;margin-left:4px"><span class="avatar">JS</span><span style="color:var(--fg-3)">${ic('cd',14)}</span></span></div>
 </header>
 <div class="shell">
  <nav class="side ${rail?'rail':'open'}" aria-label="Main">
   <button class="nav" title="Dashboard">${ic('dash',18)}<span>Dashboard</span></button>
   <button class="nav on" title="Programs" onclick="A.go('program')">${ic('box',18)}<span>Programs</span></button>
   <button class="nav" title="Library">${ic('lib',18)}<span>Library</span><span class="chev">${ic(rail?'cr':'cu',16)}</span></button>
   <div class="subnav"><button>Surveys</button><button>Themes</button><button>Alerts</button></div>
  </nav>
  <button class="collapse" style="left:${rail?50:222}px" aria-label="${rail?'Expand':'Collapse'} sidebar" onclick="A.toggleRail()">${ic(rail?'cr':'cl',12)}</button>
  <section class="pane">${inner}</section>
 </div></div>`;
}
/* ================= Program page ================= */
function tgl(on=true){return `<span class="tgl ${on?'':'off'}" role="switch" aria-checked="${on}"><i>${on?ic('check',11,'stroke-width="3"'):''}</i></span>`}
function viewProgram(){
 const pg=S.prog,isNew=pg.isNew,d=S.decision,live=d&&d.choice==='live'&&d.v>0,c=confCount();
 const head=`<div class="phead">
  <div class="crumbs"><button>Programs</button><span>/</span><span class="cur">${isNew?'New program':pg.name}</span>${tip('A Program controls who receives a survey, when it is sent, and which survey experience is used.','l')}</div>
  <div class="hbtns">
   <button class="btn out" onclick="A.testProgram()">${ic('flask',16)}Test program</button>
   <span class="vdiv"></span>
   <button class="btn out mw" onclick="A.soon('Cancel')">Cancel</button>
   ${isNew?`<button class="btn pri mw" onclick="A.soon('Activate')">Activate</button>`:`<button class="btn out mw" onclick="A.soon('Deactivate')">Deactivate</button><button class="btn mw" disabled>Save</button>`}
  </div></div>`;
 const done=okc(16);
 const nav=`<nav class="znav" aria-label="Sections">
  <a class="step" href="#s-sur">${done}<span class="sl">Survey</span></a>
  <a class="step" href="#s-del">${done}<span class="sl">Delivery</span></a>
  <a class="step" href="#s-aud">${done}<span class="sl">Audience</span></a>
  <a class="step" href="#s-act"><span class="emc"></span><span class="sl">Actions <span class="sec" style="font-weight:400">(optional)</span></span></a>
  <div class="ndiv"></div><span class="t-sm sec">3 of 4 sections done</span></nav>`;
 const ch=(t,tp,ok=true)=>`<div class="chead"><div class="row"><span class="t-h">${t}</span>${tip(tp)}</div>${ok?done:'<span class="emc"></span>'}</div>`;
 const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(x=>`<span class="day">${ic('check',12,'stroke-width="2.5"')}${x}</span>`).join('');
 let strip='';
 if(live)strip=`<div class="strip ok">${okc(18)}<span class="grow"><b class="t-lbl">Contextual follow-ups are live</b> · v${d.v} · ${d.conf} of ${d.n} confident · ${ME}, ${d.at}</span><button class="btn out sm" onclick="A.drawer('log')">Decision log</button><button class="btn out sm" onclick="A.testProgram()">Test again</button></div>`;
 else if(d)strip=`<div class="strip muted">${ic('lock',18)}<span class="grow"><b class="t-lbl">Tested, not live yet.</b> <span class="sec">Customers get the standard question. ${d.conf} of ${d.n} confident when you decided.</span></span><button class="btn out sm" onclick="A.drawer('log')">Decision log</button><button class="btn out sm" onclick="A.testProgram()">Continue testing</button></div>`;
 else if(S.introSeen&&S.batch.length)strip=`<div class="strip muted">${ic('flask',18)}<span class="grow"><b class="t-lbl">Test in progress.</b> <span class="sec">${c} of ${RECO} confident. Nothing is live until you decide.</span></span><button class="btn out sm" onclick="A.testProgram()">Continue testing</button></div>`;
 const main=`<div class="zmain">${strip}
  <div class="card"><div class="fld"><div class="row" style="justify-content:space-between;margin-bottom:2px"><span class="t-lbl">Program name <span class="req">*</span></span>${isNew?`<span class="t-sm sec">${pg.name.length}/50</span>`:''}</div><input class="input" value="${pg.name}" ${isNew?'':'disabled'} aria-label="Program name"></div></div>
  <div class="card" id="s-sur"><div class="chead"><div class="row"><span class="t-h">Survey <span class="req">*</span></span>${tip('Choose the survey you want to send. If the survey is updated in the library, all programs using it will automatically use the latest version.')}</div>${done}</div>
   <div class="gbox"><div class="gbox-h" style="gap:16px"><span class="icirc">${ic('clip',18)}</span><span class="t-lbl">${pg.survey}</span><span class="tag ai">Contextual</span>${live?`<span class="tag ok">${ic('check',12)}Follow-ups live · v${d.v}</span>`:''}<span class="grow"></span><button class="btn out" onclick="A.soon('Changing survey')">Change survey</button></div>
    <div class="gbox-f t-sm" style="color:var(--fg-2)"><span>Question types: <span style="color:var(--fg)">CSAT (1-5), Verbatim</span></span><span>Updated on: <span style="color:var(--fg)">${pg.updatedOn}&nbsp; ${pg.updatedAt}</span></span><span>Updated by: <span style="color:var(--fg)">Maria Cohen</span></span></div></div></div>
  <div class="card" id="s-del">${ch('Delivery','Choose how and when customers receive this survey. Select the channel, schedule, and survey hours for this program.')}
   <div class="row" style="gap:10px"><span class="t-lbl">Active date range</span>${tgl()}<span class="sec">Ongoing</span></div>
   <div class="row" style="gap:16px;margin-top:12px;align-items:flex-start">
    <div class="fld"><span class="t-lbl">Start date <span class="req">*</span></span><div class="datei">${pg.start}${ic('cal',14)}</div></div>
    <div class="fld"><span class="t-lbl">End date</span><div class="datei dis">Ongoing</div></div></div>
   <div class="sub"><div class="row" style="gap:10px"><span class="t-lbl">Survey hours</span>${tgl()}<span class="sec">All day (24 hrs)</span></div></div>
   <div class="sub"><div class="row" style="gap:10px;margin-bottom:12px"><span class="t-lbl">Surveying days <span class="req">*</span></span>${tgl()}<span class="sec">Select all</span></div><div class="days">${days}</div></div>
   <div class="sub"><div class="t-lbl" style="margin-bottom:8px">Select channels <span class="req">*</span></div><div class="row"><span class="chan on">${ic('chat',14)}Digital</span><span class="chan dis">${ic('phone',14)}IVR</span></div></div>
   <div class="sub"><div class="row" style="gap:6px;margin-bottom:12px"><span class="t-lbl">Themes</span>${tip('The theme owns how each question looks and every message the customer reads. One per channel.')}</div>
    <div class="gbox"><div class="gbox-h"><span class="icirc">${ic('chat',18)}</span><span class="t-h grow row">Digital <span class="tag info" style="font-weight:400">${ic('lock',12)}System Default</span></span><button class="btn out sm" onclick="A.soon('Changing theme')">Change theme</button></div>
     <div class="gbox-f"><span>Control style: <b>List picker</b></span><span>Message mode: <b>Invitation with opt out</b></span><span class="grow"></span><button class="row" style="gap:2px;color:var(--fg-2)">View more details${ic('cr',14)}</button></div></div></div>
  </div>
  <div class="card" id="s-aud">${ch('Audience',"Choose who can receive this survey. These audience settings apply only to this program and won't affect other programs.")}
   <div class="col" style="gap:4px"><span class="t-lbl">Who gets surveyed <span class="req">*</span></span><div class="seg"><button class="on">Teams</button><button>Skills</button></div></div>
   <div class="fld" style="margin-top:12px"><span class="t-lbl">Select teams <span class="req">*</span></span><div class="sel">All teams<span class="sec">${ic('cd',14)}</span></div><span class="t-sm sec">50 of 50 teams selected</span></div>
   <div class="row" style="margin-top:12px"><span class="sec">${ic('ucheck',20)}</span><span class="t-lbl">Total agents selected: ${pg.agents}</span></div>
   <div class="sub"><div class="row">${tgl(false)}<span>Filter by interaction duration <span class="sec">(optional)</span></span></div></div>
   <div class="sub">
    <div class="t-lbl" style="margin-bottom:2px">Suppression rules</div><div class="t-sm sec" style="margin-bottom:16px">Define when not to send surveys, even if an interaction otherwise qualifies.</div>
    <div class="col" style="gap:4px;margin-bottom:16px"><div class="row">${tgl()}<span>Opt-out tag</span></div><span class="t-sm sec">Skip any customer flagged as opted out.</span></div>
    <div class="col" style="gap:8px"><div class="row">${tgl()}<span>Recency window</span></div>
     <div class="num"><span class="grow" style="padding:0 12px">30 Days</span><span class="st"><span>${ic('cu',12)}</span><span>${ic('cd',12)}</span></span></div>
     <span class="t-sm sec">Don't survey the same customer twice within a configurable number of days</span></div>
   </div>
  </div>
  <div class="card" id="s-act"><div class="chead"><div class="row"><span class="t-h">Actions <span class="sec" style="font-weight:400">(optional)</span></span>${tip('Optional. Who gets notified when a response needs attention. Pick a reusable set from the library.')}</div><span class="emc"></span></div>
   <button class="btn out" onclick="A.soon('Action sets')">${ic('search',14)}Select action set from library</button></div>
 </div>`;
 const stColor=isNew?'var(--fg-2)':'var(--ok)';
 const testVal=live?`<span style="color:var(--ok)">Live · v${d.v}</span>`:d?'Not live yet':S.introSeen&&S.batch.length?`${c} of ${RECO} confident`:'Not tested';
 const side=`<aside class="zside"><div class="sum">
  <div class="t-h">Summary</div>
  <div class="srow"><span class="k">${isNew?'Created on':'Updated on'}</span><span class="v">${pg.updatedOn}<br>${pg.updatedAt}</span></div>
  <div class="srow"><span class="k">${isNew?'Created by':'Updated by'}</span><span class="v">${ME}</span></div>
  <div class="srow" style="align-items:center"><span class="k">Status</span><span class="v row" style="gap:4px;color:${stColor}">${ic('power',16)}${pg.status}</span></div>
  <div class="srow" style="align-items:center"><span class="k row" style="gap:4px">Follow-up test ${tip('Play the AI follow-ups as the customer before they go live. Use Test program at the top.','r')}</span><span class="v">${testVal}</span></div>
 </div></aside>`;
 return shell(head+`<div class="zbody">${nav}${main}${side}</div>`);
}


/* ================= Intro (first visit only) ================= */
function viewIntro(){
 const d=i=>`style="animation-delay:${(i*0.7).toFixed(1)}s"`,e=i=>`style="animation-delay:${(i*90)}ms"`,back=!!(S.introSeen&&S.howFrom);
 const head=`<div class="phead">
  <div class="crumbs"><button onclick="A.go('program')">Programs</button><span>/</span><button onclick="A.go('program')">${PROG()}</button><span>/</span><span class="cur">Test ${PROG()}</span></div>
  <div class="hbtns"><button class="btn out" onclick="${back?'A.exit()':"A.go('program')"}">Exit test</button></div></div>`;
 const body=`<div class="intro">
  <div class="intro-l">
   <h1 class="iin" ${e(0)}>Rehearse the survey before your customers see it</h1>
   <p class="lead iin" ${e(1)}>For ${PROG()}. Nothing here reaches a customer.</p>
   <div class="isteps">
    <div class="istep iin" ${e(2)}><span class="inum">1</span><span>Watch a real chat get read</span></div>
    <div class="istep iin" ${e(3)}><span class="inum">2</span><span>Answer as the customer</span></div>
    <div class="istep iin" ${e(4)}><span class="inum">3</span><span>Say I'm confident, then decide</span></div>
   </div>
   <div class="col iin" style="gap:16px;align-items:flex-start;animation-delay:540ms">${back?`<button class="btn pri" onclick="A.howBack()">Back to the test${ic('arrow',16)}</button>`:`<button class="btn pri" onclick="A.start()">Start testing${ic('arrow',16)}</button>`}
   <span class="t-sm sec row">${ic('lock',14)}Nothing goes live until you sign off.</span></div>
  </div>
  <div class="intro-r"><div class="pcard" aria-hidden="true"><div class="ph-h">Billing team</div><div class="pbd">
    <div class="bub b an" ${d(0)}>How would you rate your experience today?</div>
    <div class="pr an" ${d(1)}>${[1,2,3,4,5].map(n=>`<span class="${n===3?'on':''}">${n}</span>`).join('')}</div>
    <div class="bub ai an" ${d(2)}>${ic('spark',14)}<span>What was missing from how we handled your refund?</span></div>
    <div class="bub u an" ${d(3)}>Fixed in the end, but I had to explain it twice.</div>
    <span class="conf an" ${d(4)}>${ic('check',14)}You: I'm confident</span></div></div></div>
 </div>`;
 return shell(head+body);
}

/* Test header: Exit, and the decision always one click away */
function testHead(){
 const c=confCount();
 return `<div class="phead">
  <div class="crumbs"><button onclick="A.go('program')">Programs</button><span>/</span><button onclick="A.go('program')">${PROG()}</button><span>/</span><span class="cur">Test ${PROG()}</span></div>
  <div class="hbtns">
   <span class="hastip"><button class="btn ghost hb-log" onclick="A.how()" aria-describedby="how-tip">${ic('help',16)}How it works</button><span class="tipbox" id="how-tip" role="tooltip" style="width:240px">A quick look at how testing works. Your progress stays as it is.</span></span>
   <span class="vdiv"></span>
   <span class="hastip"><button class="btn out" onclick="A.exit()" aria-describedby="exit-tip">Save and exit</button><span class="tipbox" id="exit-tip" role="tooltip" style="width:280px">Your test batch, verdicts, follow-up changes and rules are kept. Nothing goes live. Continue any time from the program page.</span></span>
   <span class="hastip"><button class="btn out hb-sec" onclick="A.drawer('log')" aria-describedby="log-tip">${ic('history',16)}Decision log</button><span class="tipbox" id="log-tip" role="tooltip" style="left:auto;right:0;transform:none;width:260px">Every verdict, follow-up change and rule in this test, with who did it and when.</span></span>
   <button class="btn pri" onclick="A.decide()">${ic('zap',16)}Your decision</button>
  </div></div>`;
}

/* ================= Left vertical stepper (whole test) ================= */
/* 1 Find interactions (hub) · 2 Test an interaction (3 checks, from stepStates) · 3 Your decision. The emulator page has no stepper of its own. */
function tnav(){
 const v=S.view,k=v==='test'?S.cur:null,n=S.batch.length,c=confCount(),pend=pendingList().length;
 const s1=v==='hub'?'cur':n?'done':'todo';
 const s2=v==='test'?'cur':'todo';
 let a='todo',b='todo',c3='todo',sub2='';
 if(k){const {c1,c2,c3:d3,cur}=stepStates(k);a=c1?'done':cur===1?'cur':'todo';b=c2?'done':cur===2?'cur':'todo';c3=d3?'done':cur===3?'cur':'todo';sub2=P(k).name}
 /* the active main step's dot pulses for 10s from the moment that step becomes active; the negative delay keeps it smooth across re-renders */
 const act=v==='hub'?1:v==='test'?2:0;
 if(!S.navAct||S.navAct.s!==act)S.navAct={s:act,t:Date.now()};
 const el=Date.now()-S.navAct.t,anim=el<10000;
 const dot=s=>s==='done'?okc(16):s==='cur'?`<span class="curc ${anim?'pulse':''}" ${anim?`style="animation-delay:-${el}ms"`:''}></span>`:'<span class="emc"></span>';
 const dotS=s=>s==='done'?okc(14):s==='cur'?'<span class="curc"></span>':'<span class="emc"></span>';
 const dec=S.decision?'done':'todo';
 const sub1=n?`${n} in your batch${c?` · ${c} confident`:''}`:'Add a few chats to test';
 const sub3=S.decision?(S.decision.choice==='live'?`Live · v${S.decision.v}`:'Not yet'):c>=RECO&&!pend?'Ready when you are':`${c} of ${RECO} confident`;
 const f=P(k||S.batch[0]||'marcus').first;
 const step2Click=v==='test'?'':n?`onclick="A.stepTest()"`:'';
 return `<nav class="tnav" aria-label="Test steps">
  <button class="tstep click ${s1}" onclick="A.go('hub')" aria-current="${v==='hub'?'step':'false'}">${dot(s1)}<span class="lt"><span class="l">1 Find interactions</span><span class="s">${sub1}</span></span></button>
  <div class="tgap"></div>
  <button class="tstep click ${s2} ${!k&&!n?'dis':''}" ${step2Click} aria-current="${v==='test'?'step':'false'}" ${!k&&!n?'aria-disabled="true"':''}>${dot(s2)}<span class="lt"><span class="l">2 Test an interaction</span><span class="s">${k?esc(sub2):n?'Open one from your batch':'Nothing to test yet'}</span></span></button>
  <div class="tsubs">
   <button class="tstep lvl2 ${a} ${k?'click':''}" ${k?'onclick="A.focusStep(1)"':''}>${dotS(a)}<span class="lt"><span class="l">Check conversation &amp; AI read</span></span></button>
   <button class="tstep lvl2 ${b} ${k?'click':''}" ${k?'onclick="A.focusStep(2)"':''}>${dotS(b)}<span class="lt"><span class="l">Answer as ${k?esc(f):'the customer'}</span></span></button>
   <button class="tstep lvl2 ${c3} ${k?'click':''}" ${k?'onclick="A.focusStep(3)"':''}>${dotS(c3)}<span class="lt"><span class="l">${k&&!isCtx(k)?'Check the follow-up':'Check follow-ups by rating'}</span></span></button>
  </div>
  <div class="tgap"></div>
  <button class="tstep click ${dec}" onclick="A.decide()">${dot(dec)}<span class="lt"><span class="l">3 Your decision</span><span class="s">${sub3}</span></span></button>
  <div class="tfootn">${ic('lock',14)}<span>Nothing goes live until you decide.</span></div>
 </nav>`;
}

/* ================= Shared cell renderers ================= */

/* ===== Hover summary on the status chip: what happened, per rating, and what to do ===== */
const MOOD={low:'Unhappy',mid:'Neutral',high:'Happy'},RNG={low:'1–2',mid:'3',high:'4–5'};
function fuSummary(k){const s=ST(k),out=[];
 BANDS.forEach(b=>{const x=s.bands[b],now=qText(k,b),br=breaks(k,b),lines=[];
  if(x.st==='pending')lines.push({fix:1,t:x.mode==='compare'?'The AI rewrote it, but you haven’t picked which version to keep.':`You started changing it but didn’t finish.${x.reasons&&x.reasons.length?` You picked: ${x.reasons.join(', ')}.`:''}`});
  br.forEach(r=>lines.push({fix:1,rule:1,t:ruleWhat(r,now,k).sentence}));
  if(lines.length)out.push({b,now,lines})});
 return out}
function hoverCard(k){
 const s=ST(k),p=P(k),items=fuSummary(k),nfix=items.length,hasRule=items.some(i=>i.lines.some(l=>l.rule)),hasChange=items.some(i=>i.lines.some(l=>!l.rule));

 <div class="hv-f"><span class="hv-fi">${ic('arrow',14)}</span><span><b class="hv-fl">What to do</b> ${todo}</span></div>`;

(function(){if(window.__hv)return;window.__hv=1;
 const el=document.createElement('div');el.id='hv';el.className='hv';el.setAttribute('role','tooltip');document.body.appendChild(el);
 let cur=null;
 const show=t=>{const k=t.getAttribute('data-hv');if(!k)return;cur=t;el.innerHTML=hoverCard(k);el.classList.add('on');
  const r=t.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,vw=innerWidth,vh=innerHeight;
  let x=Math.min(r.left,vw-w-16),y=r.bottom+8;if(y+h>vh-12)y=Math.max(12,r.top-h-8);
  el.style.left=Math.max(12,x)+'px';el.style.top=y+'px'};
 const hide=()=>{cur=null;el.classList.remove('on')};
 document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-hv]');if(t&&t!==cur)show(t);else if(!t&&cur)hide()});
 document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-hv]');t?show(t):hide()});

/* ================= Your decision (minimal) ================= */
function drawerDecision(){
 const c=confCount(),n=S.batch.length,live=S.dChoice==='live',pend=pendingList(),nx=nextUp();
 const played=testedList().length,ctxN=S.batch.filter(isCtx).length,ch=changedList().filter(x=>S.batch.includes(x.k)).length;
 const rc=[{done:c>=RECO,t:`Confident in ${RECO} interactions`,s:c>=RECO?`${c} confident`:`${c} of ${RECO} so far`,a:nx?{l:'Test next',fn:`A.open('${nx}')`}:{l:'Add more',fn:"A.go('hub')"}},
  {done:!pend.length,t:'No follow-up waiting on a change',s:pend.length?`${pend.length} waiting · ${P(pend[0].k).name}`:'All changes finished',a:pend.length?{l:'Open '+P(pend[0].k).first,fn:'A.gotoPending()'}:null}];
 const o=rc.filter(x=>!x.done),ready=!o.length,needSign=live,can=!needSign||S.signed;
 /* 1 · the verdict, one focal point */
 const hero=`<section class="dv">
   <div class="dv-top"><div class="ring lg">${ringSvg(c,RECO,72)}<b>${c}<span>/${RECO}</span></b></div>
    <div class="col grow" style="gap:6px"><h3 class="dv-t">${ready?'Ready to go live':c>=RECO?`Confident in ${c} interactions`:`Confident in ${c} of ${RECO} recommended`}</h3>
     <p class="dv-s">${ready?'Both recommendations are met. The call is still yours.':`Feedback Intelligence recommends being confident in ${RECO} interactions, with every follow-up change finished, before go-live. You decide.`}</p></div></div>
   <ul class="dv-list">${rc.map(x=>`<li class="dv-row"><span class="dv-i ${x.done?'ok':'todo'}">${x.done?ic('check',12,'stroke-width="3"'):''}</span><span class="grow">${x.t}</span><span class="dv-st ${x.done?'':'warn'}">${x.s}</span>${x.done||!x.a?'<span class="dv-a"></span>':`<button class="textlink dv-a" onclick="${x.a.fn}">${x.a.l} →</button>`}</li>`).join('')}</ul>
  </section>`;
 /* 2 · the evidence: four figures, then who */
 const fig=(v,l,sub,cap)=>`<div class="fig"><span class="fig-l">${l}</span><b>${v}${sub?`<span>${sub}</span>`:''}</b>${cap?`<span class="fig-c">${cap}</span>`:''}</div>`;
 const chip=k=>{const s=ST(k),pc=pendingFor(k);return `<button class="chip ${s.status==='confident'?'ok':''}" onclick="A.open('${k}')">${s.status==='confident'?okc(14):pc?`<span class="chip-w">${ic('alert',14)}</span>`:'<span class="emc" style="width:14px;height:14px"></span>'}${P(k).name}</button>`};
 const confK=S.batch.filter(k=>ST(k).status==='confident'),restK=S.batch.filter(k=>ST(k).status!=='confident');
 const showed=`<section class="dsec" style="gap:16px"><span class="dlbl">What this test showed</span>
   <div class="figs">${fig(c,'Confident in',` of ${n}`,`${RECO} or more recommended`)}${fig(played,'Played as the customer','',`Survey${played===1?'':'s'} you answered yourself`)}${fig(ctxN,'Contextual follow-ups',` of ${n}`,ctxN<n?'The rest use the standard question':'Every interaction gets one')}${fig(ch,'Follow-ups you changed','',ch?'Rewritten and kept by you':'All kept as written')}</div>
   <div class="col" style="gap:10px">
    ${confK.length?`<div class="dgrp"><span class="dgrp-l">Confident</span><div class="chips">${confK.map(chip).join('')}</div></div>`:''}
    ${restK.length?`<div class="dgrp"><span class="dgrp-l">Not yet</span><div class="chips">${restK.map(chip).join('')}</div></div>`:''}
   </div></section>`;
 /* 3 · the decision */
 const opt=(v,icon,t,s)=>`<button class="dopt ${S.dChoice===v?'on':''}" role="radio" aria-checked="${S.dChoice===v}" onclick="A.choose('${v}')"><span class="radio"></span><span class="dopt-ic">${ic(icon,18)}</span><span class="col grow" style="gap:2px"><span class="t-lbl">${t}</span><span class="t-13 sec">${s}</span></span></button>`;
 const decide=`<section class="dsec" style="gap:12px"><span class="dlbl">Your decision</span>
   <div class="dopts" role="radiogroup" aria-label="Your decision">${opt('live','zap','Go live for all',`Contextual follow-ups on every interaction of ${PROG()}.`)}${opt('notyet','clock','Not yet','The program keeps its standard questions. Test again whenever you like.')}</div>
   ${needSign?`<div class="dnote ${ready?'ok':''}"><div class="col" style="gap:4px"><span class="t-lbl row" style="gap:8px">${ready?ic('shield',16):ic('alert',16)}${ready?'Sign-off':`Going ahead with ${o.length} recommendation${o.length>1?'s':''} not done`}</span>${ready?`<span class="t-13 sec">Your sign-off is what puts the contextual follow-ups live. It goes in the decision log with everything this test showed.</span>`:o.map(x=>`<span class="t-13 sec">${x.t} · ${x.s}</span>`).join('')}</div>
    <label class="dnote-c"><input type="checkbox" class="cb" ${S.signed?'checked':''} onchange="A.sign(this.checked)"><span class="col" style="gap:2px"><span class="t-lbl">I've reviewed this and I'm going ahead.</span><span class="t-sm sec">Signed as ${ME}, and saved to this program's decision log${S.rules.length?` with your ${S.rules.length} rule${S.rules.length>1?'s':''}`:''}.</span></span></label></div>`:''}
  </section>`;
 return `<div class="scrim" onclick="A.close()"></div><aside class="drawer wide dec" role="dialog" aria-label="Your decision">
  <div class="dh"><div class="col grow"><h2 class="t-h">Your decision</h2><span class="t-sm sec">Test ${PROG()}</span></div><button class="iconbtn" aria-label="Close" onclick="A.close()">${ic('x',18)}</button></div>
  <div class="db" style="gap:32px;padding:24px 28px 32px">${hero}${showed}${decide}</div>
  <div class="df"><button class="btn ghost" style="margin-right:auto;margin-left:-8px" onclick="A.drawer('log')">${ic('history',16)}Decision log</button><button class="btn out" onclick="A.close()">Back to testing</button><button class="btn pri" ${can?'':'disabled'} onclick="A.apply()">${live?'Go live for all':'Save decision'}</button></div></aside>`;
}

   <section class="dsec" style="gap:0"><h3 style="margin-bottom:4px">In force now</h3>
    <div class="logi"><span class="${live?'okc':'emc'}">${live?ic('check',10,'stroke-width="3.5"'):''}</span><span class="grow">${live?`Contextual follow-ups are live (v${d.v}).`:'Standard questions. No contextual follow-ups are live.'}</span></div>
    ${rules}${rws}${!rules&&!rws?'<p class="t-sm sec" style="padding:8px 0">No rules or changes yet. Add them while you test.</p>':''}</section>
   <section class="dsec" style="gap:0"><h3 style="margin-bottom:4px">History</h3>
    ${S.log.length?S.log.map(l=>`<div class="logi" style="padding:8px 0"><span class="sec">${ic(LI[l.kind]||'flask',14)}</span><div class="grow col"><span class="t-13">${esc(l.text)}</span><span class="t-sm sec">${l.at}</span></div></div>`).join(''):'<p class="t-sm sec">Nothing yet.</p>'}</section>
  </div></aside>`;
}

/* ================= Render ================= */
function render(){
 const v=S.view;
 document.getElementById('app').innerHTML=v==='program'?viewProgram():v==='intro'?viewIntro():v==='hub'?viewHub():viewTest();
 const ov=S.drawer==='decision'?drawerDecision():S.drawer==='list'?drawerList():S.drawer==='chat'?drawerChat():S.drawer==='log'?drawerLog():S.drawer==='hist'?drawerHist():'';
 document.getElementById('layer').innerHTML=ov+(S.modal==='unconf'?modalUnconf():'')+
  `<div class="demo ${S.demoMin?'min':''}" aria-label="Scenarios"><span role="button" tabindex="0" onclick="S.demoMin=!S.demoMin;render()">Scenario</span><button class="${S.scenario==='new'?'on':''}" onclick="A.demo('new')">New program</button><button class="${S.scenario==='existing'?'on':''}" onclick="A.demo('existing')">Existing program</button><button class="${S.scenario==='inprog'?'on':''}" onclick="A.demo('inprog')">In progress · 7</button><button class="${S.scenario==='ready'?'on':''}" onclick="A.demo('ready')">Ready to decide</button></div>`;
 const ind=document.querySelector('input[data-ind]');if(ind)ind.indeterminate=true;
 const lv=document.getElementById('live');if(lv)lv.scrollTop=lv.scrollHeight;
 const pb=document.getElementById('phb');if(pb){const pv=pb.querySelector('.bub-pv');pb.scrollTop=pv?Math.max(0,pv.offsetTop-pb.offsetTop-48):pb.scrollHeight}
 placeMenu();
}
/* row menus float above the table (fixed position), so a scrolling table never clips them */
function placeMenu(){const m=document.querySelector('.menuwrap .menu');if(!m)return;const b=m.parentElement.querySelector('.iconbtn');if(!b)return;
 const r=b.getBoundingClientRect();m.classList.add('floating');const h=m.offsetHeight,w=m.offsetWidth;
 let top=r.bottom+6;if(top+h>innerHeight-12)top=Math.max(12,r.top-h-6);
 m.style.top=top+'px';m.style.left=Math.max(12,Math.min(r.right-w,innerWidth-w-12))+'px'}
document.addEventListener('scroll',e=>{if(S.menu&&!(e.target.closest&&e.target.closest('.menu'))){S.menu=null;render()}},true);
addEventListener('resize',()=>{if(S.menu)placeMenu()});
/* ===== Embedded in the Feedback Management app (Nov 2) =====
   Opened as  ?embed=1&mode=new|existing&name=<program name>
   The inner top bar and sidebar are hidden; the app is told when the user leaves the test. */
(function(){
 const q=new URLSearchParams(location.search);
 if(q.get('embed')!=='1'){A.demo('inprog');return}             /* opened on its own: In progress scenario, as before */
 document.documentElement.classList.add('embed');
 const name=q.get('name'),mode=q.get('mode')==='new'?'new':'existing';
 const post=t=>{try{parent.postMessage({src:'fi-test-program',type:t},'*')}catch(e){}};
 const useName=()=>{if(name)S.prog.name=name};
 /* anything that lands on the inner program page = leave the test and go back to the app's program page */
 const go0=A.go.bind(A);A.go=v=>{if(v==='program'){post('fi-test-close');return}go0(v)};
 const exit0=A.exit.bind(A);A.exit=()=>{exit0();post('fi-test-close')};
 const apply0=A.apply.bind(A);A.apply=()=>{const live=S.dChoice==='live';apply0();post(live?'fi-test-golive':'fi-test-close')};
 /* the scenario switcher stays; every scenario starts inside the test, never on the inner program page */
 const demo0=A.demo.bind(A);A.demo=w=>{demo0(w);useName();if(S.view==='program')A.testProgram()};
 A.demo(mode);
})();
</script>
